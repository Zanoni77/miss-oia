<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caça e Pesca Ilegal</title>

<link rel="stylesheet" href="style.css">

</head> <body>
<main class="container">

    <header class="cabecalho">

        <div class="icone">
            🌿
        </div>

        <p class="subtitulo">QUIZ AMBIENTAL</p>

        <h1>
            Caça e Pesca
            <span>Ilegal</span>
        </h1>

        <p class="descricao">
            Teste seus conhecimentos sobre a preservação da fauna
            e a importância de combater crimes ambientais.
        </p>

    </header>


    <section class="quiz">

        <div class="topo-quiz">

            <span>CONHECIMENTO AMBIENTAL</span>

            <strong id="contador">
                1 / 2
            </strong>

        </div>


        <div class="barra">
            <div
                class="barra-progresso"
                id="barraProgresso">
            </div>
        </div>


        <div class="pergunta">

            <div class="numero">
                🌳
            </div>

            <h2 id="pergunta">
                Carregando pergunta...
            </h2>

        </div>


        <div
            class="alternativas"
            id="alternativas">
        </div>


        <div
            class="feedback"
            id="feedback">

            <div
                class="feedback-icone"
                id="feedbackIcone">
            </div>

            <div>

                <h3 id="feedbackTitulo"></h3>

                <p id="feedbackTexto"></p>

            </div>

        </div>


        <button
            class="btn-proximo"
            id="btnProximo">

            Próxima afirmativa
            <span>→</span>

        </button>


        <div
            class="resultado"
            id="resultado">

            <div class="resultado-icone">
                🌱
            </div>

            <h2>
                Quiz finalizado!
            </h2>

            <p
                class="pontuacao"
                id="pontuacao">
            </p>

            <p
                class="mensagem"
                id="mensagem">
            </p>

            <button
                class="btn-reiniciar"
                onclick="reiniciarQuiz()">

                🔄 Fazer novamente

            </button>

        </div>

    </section>


    <footer>

        <p>
            🌎 Preserve a natureza.
            <strong>Proteja os animais.</strong>
        </p>

    </footer>

</main>


<script src="script.js"></script>

</body> </html>
