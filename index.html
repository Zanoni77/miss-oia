<main class="caixa-principal">

    <div class="folha folha1">🍃</div>
    <div class="folha folha2">🌿</div>
    <div class="folha folha3">🍂</div>

    <header class="cabecalho">
        <span class="tag">🌎 EDUCAÇÃO AMBIENTAL</span>

        <h1>Caça e Pesca <span>Ilegal</span></h1>

        <p>
            Descubra informações importantes sobre a proteção da fauna
            e os impactos dos crimes ambientais.
        </p>
    </header>

    <section class="caixa-quiz">

        <div class="progresso">
            <div class="progresso-texto">
                <span>AFIRMATIVA</span>
                <strong id="numero-pergunta">1 / 2</strong>
            </div>

            <div class="barra">
                <div class="barra-preenchida" id="barra-progresso"></div>
            </div>
        </div>

        <div class="caixa-perguntas">
            <span class="icone-pergunta">🌳</span>

            <h2 id="pergunta">
                Carregando afirmativa...
            </h2>
        </div>

        <div class="caixa-alternativas" id="alternativas">
            <!-- Alternativas criadas pelo JavaScript -->
        </div>

        <div class="feedback" id="feedback">
            <div class="feedback-icone" id="feedback-icone"></div>

            <div>
                <h3 id="feedback-titulo"></h3>
                <p id="feedback-texto"></p>
            </div>
        </div>

        <button class="botao-proximo" id="botao-proximo">
            Próxima afirmativa →
        </button>

        <div class="caixa-resultado" id="resultado">

            <div class="trofeu">🌱</div>

            <h2>Quiz concluído!</h2>

            <p class="pontuacao" id="pontuacao"></p>

            <p class="texto-resultado" id="texto-resultado"></p>

            <button class="botao-reiniciar" onclick="reiniciarQuiz()">
                🔄 Fazer o quiz novamente
            </button>

        </div>

    </section>

    <footer>
        <p>🌱 Preserve a natureza. Proteja os animais.</p>
    </footer>

</main>

<script src="script.js"></script>
