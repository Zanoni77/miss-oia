<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caça e Pesca Ilegal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="caixa-principal">

        <header class="cabecalho">
            <h1>🌳 Caça e Pesca Ilegal</h1>
            <p>
                Teste seus conhecimentos sobre a preservação da fauna
                e a importância de combater crimes ambientais.
            </p>
        </header>

        <section class="caixa-quiz">

            <div class="caixa-perguntas">
                <!-- A pergunta será inserida pelo JavaScript -->
            </div>

            <div class="caixa-alternativas">
                <!-- As alternativas serão inseridas pelo JavaScript -->
            </div>

            <div class="caixa-resultado">
                <h2>Resultado</h2>

                <p class="texto-resultado">
                    <!-- O resultado será inserido pelo JavaScript -->
                </p>

                <button class="botao-reiniciar" onclick="location.reload()">
                    🔄 Fazer o quiz novamente
                </button>
            </div>

        </section>

        <footer>
            <p>
                🌱 Preserve a natureza. Proteja os animais.
            </p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
